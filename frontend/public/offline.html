<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StockPadi — Offline Mode</title>
  <style>
    *, *:before, *:after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 12px -2px rgba(0,0,0,0.06);
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #ecfdf5;
      color: #0a6e4d;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #0a6e4d;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 10px;
      margin-bottom: 10px;
      text-align: center;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      background-color: #f1f5f9;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">⚡</div>
    <h1>You're Offline — StockPadi Still Works</h1>
    <p>Your local ledger is active. You can record sales and manage inventory offline — everything syncs when you reconnect.</p>
    <a href="/pos" class="btn">Go to Sell POS</a>
    <a href="/products" class="btn-secondary" style="margin-bottom: 10px;">View Products</a>
    <button onclick="window.location.reload()" class="btn-secondary">Check Connection</button>
  </div>
</body>
</html>
