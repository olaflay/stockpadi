<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OjàPadi — Offline Mode</title>
  <style>
    *, *:before, *:after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif;
      background-color: #080b14;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(11, 122, 85, 0.15);
      border: 1px solid rgba(11, 122, 85, 0.4);
      color: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 10px 0;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin: 0 0 28px 0;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #0b7a55;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      text-align: center;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background-color: #0d9466;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      background-color: #1e293b;
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-secondary:hover {
      background-color: #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">⚡</div>
    <h1>You're Offline — OjàPadi Still Works</h1>
    <p>Your local ledger is active. Record sales, scan barcodes, and manage shop inventory — everything syncs automatically when connection restores.</p>
    <a href="/pos" class="btn">Go to Sell POS</a>
    <a href="/products" class="btn-secondary">View Products</a>
    <button onclick="window.location.reload()" class="btn-secondary">Check Connection</button>
  </div>
</body>
</html>
