  <!-- Rounded Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#ojapadiBgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="88" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4" />

