name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install && npm --prefix frontend install && npm --prefix backend install && npm --prefix packages/contracts install

      - run: npm run lint

      - run: npm run test

      - run: npm run build
