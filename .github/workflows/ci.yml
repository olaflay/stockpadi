name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            supabase/package-lock.json
            packages/contracts/package-lock.json

      - run: npm ci

      - run: npm run contracts:build

      # frontend/, backend/, and supabase/ are independently locked deployable
      # packages, not root workspace packages. Root npm ci alone therefore
      # cannot install their lint/test/build tooling.
      - run: npm --prefix frontend ci

      - run: npm --prefix backend ci

      # supabase/ holds the PGlite suites that boot every shipped migration and
      # assert the sync_apply_* merge logic and RLS policies. Without this the
      # database layer had no automated coverage in CI at all.
      - run: npm --prefix supabase ci

      - run: npm run lint

      - run: node --test scripts/verify-deployment.test.mjs
      - run: npm run test

      - name: Install browser for offline smoke checks
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium

      - name: Build frontend and verify offline browser recovery
        env:
          NEXT_PUBLIC_APP_ENV: staging
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PROJECT_REF: ci-build-placeholder
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          NEXT_PUBLIC_BACKEND_URL: https://api.ci.example.invalid
          NEXT_PUBLIC_SITE_URL: https://app.ci.example.invalid
          NEXT_PUBLIC_BUILD_VERSION: ${{ github.sha }}
        run: |
          npm run build
          npm --prefix frontend run test:e2e

      - run: npm run backend:build

  migrate-production:
    name: Apply and verify production migrations
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm --prefix backend ci

      - name: Require hosted migration credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/require-migration-credentials.mjs

      - name: Apply pending database migrations safely
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        # Run directly so the runner uses injected GitHub secrets and does not
        # require the developer-only backend/.env file to exist in the checkout.
        run: node backend/scripts/migrate.mjs

      - name: Verify hosted migration state
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node backend/scripts/verify-migrations.mjs
