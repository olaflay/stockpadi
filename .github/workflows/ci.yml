name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            supabase/package-lock.json
            packages/contracts/package-lock.json

      - run: npm ci

      - run: npm run contracts:build

      # frontend/ and backend/ are independently locked packages, not root
      # workspaces. Root npm ci alone therefore cannot install ESLint or the
      # frontend test/build tooling.
      - run: npm --prefix frontend ci

      - run: npm --prefix backend ci

      # supabase/ holds the PGlite suites that boot every shipped migration and
      # assert the sync_apply_* merge logic and RLS policies. Without this the
      # database layer had no automated coverage in CI at all.
      - run: npm --prefix supabase ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # Automatically run pending migrations against Supabase Cloud on main
      # to prevent temporal inversion where app code deploys before database columns exist.
      - name: Apply Pending Database Migrations
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            npm --prefix backend run db:migrate
          else
            echo "Notice: SUPABASE_DB_URL secret not configured in repository; skipping automated cloud migration."
          fi
