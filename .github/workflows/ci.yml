name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Ensure postinstall isn't failing to install sub-dependencies by manually installing them for CI just in case
      - run: npm --prefix frontend install && npm --prefix backend install

      - run: npm run lint

      - run: npm run test

      - run: npm run build
