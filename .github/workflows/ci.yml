name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            supabase/package-lock.json
            packages/contracts/package-lock.json

      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend

      - run: npm run contracts:build

      # frontend/, backend/, and supabase/ are independently locked deployable
      # packages, not root workspace packages. Root npm ci alone therefore
      # cannot install their lint/test/build tooling.
      - run: npm --prefix frontend ci

      - run: npm --prefix backend ci

      # supabase/ holds the PGlite suites that boot every shipped migration and
      # assert the sync_apply_* merge logic and RLS policies. Without this the
      # database layer had no automated coverage in CI at all.
      - run: npm --prefix supabase ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      - run: npm run backend:build

      # Production database verification is required on main. Pull requests
      # intentionally skip hosted DB access in the explicit step below.
      - name: Require hosted migration credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/require-migration-credentials.mjs

      - name: Apply pending database migrations safely
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm --prefix backend run db:migrate

      - name: Verify hosted migration state
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm --prefix backend run db:verify

      - name: Explicitly skip hosted database verification for pull requests
        if: github.event_name == 'pull_request'
        run: echo "Hosted migration execution is intentionally not run for pull requests; main-branch release verification requires SUPABASE_DB_URL."
