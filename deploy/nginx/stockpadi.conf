# Reverse proxy in front of the Coolify-managed containers on the VPS, per
# .agents/rules/hosting-and-deployment.md ("Operational requirements on the
# VPS"). Coolify still owns the app/Supabase containers and TLS cert
# issuance (Let's Encrypt via Coolify's proxy) — this file is an additional,
# explicit edge layer for anyone who wants nginx as the public-facing
# terminator instead of relying solely on Coolify's bundled proxy.
#
# Replace APP_DOMAIN / APP_UPSTREAM_PORT / SUPABASE_UPSTREAM_PORT with the
# real values for this deployment (never commit real domains/ports here,
# per .agents/rules/reusability-and-multi-client.md — copy this file to the
# VPS and fill in the real values there, or template it via Coolify's
# environment substitution).

# Next.js app (PWA)
server {
    listen 443 ssl http2;
    server_name APP_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:APP_UPSTREAM_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker and manifest must never be cached at the edge, or a
    # deployed update can't reach an already-installed PWA. See
    # src/app/sw.ts and public/manifest.json.
    location ~* /(sw\.js|manifest\.json)$ {
        proxy_pass http://127.0.0.1:APP_UPSTREAM_PORT;
        add_header Cache-Control "no-cache";
    }
}

# Self-hosted Supabase (Postgres REST, Auth, Realtime, Storage, Edge
# Functions), all served behind Supabase's own Kong gateway container on
# this VPS. Realtime needs the WebSocket upgrade headers below.
server {
    listen 443 ssl http2;
    server_name SUPABASE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/SUPABASE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SUPABASE_DOMAIN/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:SUPABASE_UPSTREAM_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name APP_DOMAIN SUPABASE_DOMAIN;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
